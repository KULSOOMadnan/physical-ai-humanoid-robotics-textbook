[build]
builder = "nixpacks"
command = "pip install --upgrade pip && pip install -r requirements.txt && pip install 'uvicorn[standard]'"

[deploy]
startCommand = "python -c \"import sys; sys.path.insert(0, '.'); from app.main import app; import uvicorn; uvicorn.run(app, host='0.0.0.0', port=int('${PORT:-8000}'))\""

[variables]
DATABASE_URL = { fromService = "postgres", as = "DATABASE_URL" }
QDRANT_URL = { fromService = "qdrant", as = "QDRANT_URL" }
QDRANT_API_KEY = { fromService = "qdrant", as = "QDRANT_API_KEY" }
OPENROUTER_API_KEY = { fromEnvironment = "OPENROUTER_API_KEY" }
COHERE_API_KEY = { fromEnvironment = "COHERE_API_KEY" }
DEBUG = "true"