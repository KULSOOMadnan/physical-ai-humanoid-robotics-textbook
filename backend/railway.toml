[build]
builder = "nixpacks"
command = "pip install --upgrade pip && pip install -r requirements_railway.txt"

[deploy]
startCommand = "python -c \"from app.main import create_app; import uvicorn; uvicorn.run(create_app(), host='0.0.0.0', port=int(${PORT:-8000}), log_level='info', reload=False, workers=1)\""

[variables]
DATABASE_URL = { fromService = "postgres", as = "DATABASE_URL" }
QDRANT_URL = { fromService = "qdrant", as = "QDRANT_URL" }
QDRANT_API_KEY = { fromService = "qdrant", as = "QDRANT_API_KEY" }
OPENROUTER_API_KEY = { fromEnvironment = "OPENROUTER_API_KEY" }
COHERE_API_KEY = { fromEnvironment = "COHERE_API_KEY" }
DEBUG = "true"